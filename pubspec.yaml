name: code_test_madivizion
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.3

dependencies:
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.4
  dio: ^5.11.1
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  flutter_secure_storage: ^9.2.4
  fpdart: ^1.2.0
  go_router: ^17.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  lucide_icons_flutter: ^4.0.3
  path_provider: ^2.1.6
  # Keep the platform plugin until the pinned Flutter SDK can load iOS FFI assets reliably.
  path_provider_foundation: 2.5.1
  riverpod_annotation: ^4.0.0

dev_dependencies:
  # 2.14+ defaults to AOT, which fails with native build hooks on Dart 3.10.
  build_runner: ">=2.13.1 <2.14.0"
  drift_dev: ^2.31.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.0+1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
